
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YEP!! Bali Countdown</title>

<style type="text/css">

/* =====================================
   LOCAL FONT
   ===================================== */

@font-face {
    font-family: 'CountdownFont';
    src: url('anton.woff') format('woff');
    font-weight: 700;
    font-style: normal;
}

/* BASIC RESET */

* {
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #102d2b;
    font-family: 'CountdownFont', Arial, sans-serif;
    color: #ffffff;
}

/* =====================================
   BACKGROUND IMAGE
   ===================================== */

.background {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    overflow: hidden;
    background-color: #102d2b;
}

.background img {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}

/* DARK OVERLAY */

.overlay {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: #000000;
    opacity: 0.2;
}

/* =====================================
   HOURLY VIDEO PLAYER
   ===================================== */

#hourlyVideo {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    display: none;
    background-color: #000000;
}

/* =====================================
   MAIN COUNTDOWN CONTAINER
   ===================================== */

.container {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* SUBTITLE */

.subtitle {
    position: absolute;
    top: 13%;
    left: 10%;
    font-size: 26px;
    font-style: italic;
    font-weight: normal;
    color: #ffffff;
    text-shadow: 2px 2px 10px #666666;
}

/* DAYS AREA */

.days-area {
    position: absolute;
    top: 13%;
    left: 2.5%;
    width: 46%;
    height: 78%;
}

.days-number {
    font-family: 'CountdownFont', Impact, Arial, sans-serif;
    font-size: 690px;
    line-height: 1;
    font-weight: bold;
    letter-spacing: 5px;
    color: #ffffff;
    white-space: nowrap;
    text-shadow: 5px 5px 10px black;
}

.days-label {
    position: absolute;
    left: 105%;
    bottom: 2.5%;
    font-family: 'CountdownFont', Impact, Arial, sans-serif;
    font-size: 100px;
    line-height: 1.05;
    color: #ffffff;
    white-space: nowrap;
    text-shadow: 5px 5px 10px black;
}

/* EVENT TITLE */

.event-title {
    position: absolute;
    top: 26.5%;
    right: 3.5%;
    width: 48%;
    text-align: center;
}

.event-name {
    font-family: 'CountdownFont', Arial, sans-serif;
    font-size: 40px;
    line-height: 1.1;
    margin-bottom: 10px;
    color: #ffffff;
    text-shadow: 5px 5px 10px black;
}

.event-headline {
    font-family: 'CountdownFont', Impact, Arial, sans-serif;
    font-size: 90px;
    line-height: 1;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 5px 5px 10px black;
}

/* COUNTDOWN TIMER */

.timer {
    position: absolute;
    right: 0;
    bottom: 21%;
    width: 32%;
    height: 120px;
    text-align: center;
}

.timer-item {
    float: left;
    width: 33%;
    text-align: left;
}

.timer-value {
    font-family: 'CountdownFont', Impact, Arial, sans-serif;
    font-size: 80px;
    line-height: 1;
    font-weight: bold;
    letter-spacing: 3px;
    color: #ffffff;
    text-shadow: 5px 5px 10px black;
}

.timer-label {
    margin-top: 12px;
    font-family: 'CountdownFont', Impact, Arial, sans-serif;
    font-size: 40px;
    line-height: 1.2;
    color: #ffffff;
    text-shadow: 5px 5px 10px black;
}

</style>
</head>

<body>

<!-- =====================================
     BACKGROUND IMAGE
     ===================================== -->

<div class="background">

    <img id="backgroundImage"
         src="YEP-countdown-daylight.png"
         width="100%"
         height="100%">

    <div class="overlay"></div>

</div>


<!-- =====================================
     HOURLY VIDEO PLAYER
     ===================================== -->

<video id="hourlyVideo"
       playsinline
       preload="auto">

    <source id="hourlyVideoSource"
            src="Off Site Townhall.mp4"
            type="video/mp4">

</video>


<!-- =====================================
     COUNTDOWN SCREEN
     ===================================== -->

<div class="container" id="countdownScreen">

    <!-- SUBTITLE -->

    <div class="subtitle">
        the countdown to Bali has officially begun
    </div>


    <!-- DAYS -->

    <div class="days-area">

        <div class="days-number" id="days">
            42
        </div>

        <div class="days-label">
            DAYS<br>
            TO GO
        </div>

    </div>


    <!-- EVENT TITLE -->

    <div class="event-title">

        <div class="event-name">
            MBI &amp; HTSA Year End Party 2026
        </div>

        <div class="event-headline">
            ANDA LAYAK<br>
            DAPAT BINTANG
        </div>

    </div>


    <!-- COUNTDOWN TIMER -->

    <div class="timer">

        <div class="timer-item">
            <div class="timer-value" id="hours">00</div>
            <div class="timer-label">hours</div>
        </div>

        <div class="timer-item">
            <div class="timer-value" id="minutes">00</div>
            <div class="timer-label">minutes</div>
        </div>

        <div class="timer-item">
            <div class="timer-value" id="seconds">00</div>
            <div class="timer-label">seconds</div>
        </div>

    </div>

</div>


<!-- =====================================
     JAVASCRIPT
     ===================================== -->

<script type="text/javascript">


/* =====================================
   1. COUNTDOWN CONFIGURATION
   ===================================== */

var targetDate = new Date(2026, 11, 16, 18, 0, 0);


function updateCountdown() {

    var now = new Date();

    var difference = targetDate.getTime() - now.getTime();

    if (difference <= 0) {

        document.getElementById("days").innerHTML = "00";
        document.getElementById("hours").innerHTML = "00";
        document.getElementById("minutes").innerHTML = "00";
        document.getElementById("seconds").innerHTML = "00";

        return;
    }

    var totalSeconds = Math.floor(difference / 1000);

    var days = Math.floor(totalSeconds / 86400);

    var hours = Math.floor((totalSeconds % 86400) / 3600);

    var minutes = Math.floor((totalSeconds % 3600) / 60);

    var seconds = totalSeconds % 60;


    function formatNumber(number) {

        return number < 10 ? "0" + number : number;

    }


    document.getElementById("days").innerHTML =
        formatNumber(days);

    document.getElementById("hours").innerHTML =
        formatNumber(hours);

    document.getElementById("minutes").innerHTML =
        formatNumber(minutes);

    document.getElementById("seconds").innerHTML =
        formatNumber(seconds);

}


/* =====================================
   2. BACKGROUND IMAGE BY TIME
   ===================================== */

var imageDay = "YEP-countdown-daylight.png";

var imageSunset = "YEP-countdown-sunset.png";

var imageNight = "YEP-countdown-night.png";


function updateBackground() {

    var now = new Date();

    var hour = now.getHours();

    var selectedImage;


    if (hour >= 6 && hour < 15) {

        selectedImage = imageDay;

    }

    else if (hour >= 15 && hour < 19) {

        selectedImage = imageSunset;

    }

    else {

        selectedImage = imageNight;

    }


    var image = document.getElementById("backgroundImage");

    if (image.getAttribute("src") != selectedImage) {

        image.setAttribute("src", selectedImage);

    }

}



/* ==========================================
   HOURLY VIDEO CONFIGURATION
   ========================================== */

var hourlyVideoFile = "Off Site Townhall.mp4";

var isVideoPlaying = false;
var lastPlayedHour = "";


/* ==========================================
   PLAY HOURLY VIDEO
   ========================================== */

/* PLAYBACK SCHEDULE */
var playbackSchedule = [
	{ hour: 9, minute: 00 },
	{ hour: 10, minute: 00 },
	{ hour: 11, minute: 00 },
	{ hour: 12, minute: 00 },
	{ hour: 12, minute: 15 },
	{ hour: 12, minute: 30 },
	{ hour: 12, minute: 45 },
	{ hour: 13, minute: 00 },
	{ hour: 14, minute: 00 },
	{ hour: 15, minute: 00 },
    { hour: 15, minute: 15 },
    { hour: 15, minute: 30 },
	{ hour: 15, minute: 45 },
    { hour: 16, minute: 00 },
	{ hour: 17, minute: 00 }
];

function playHourlyVideo() {

    // Prevent another playback while video is running
    if (isVideoPlaying) {
        return;
    }

    var now = new Date();

    // Create a unique key for this date and hour
	var timeKey =
		now.getFullYear() + "-" +
		now.getMonth() + "-" +
		now.getDate() + "-" +
		now.getHours() + "-" +
		now.getMinutes();

    // Prevent replay during the same hour
    if (lastPlayedHour == timeKey) {
        return;
    }

    // Lock this hour BEFORE starting playback
    lastPlayedHour = timeKey;
    isVideoPlaying = true;

    var video = document.getElementById("hourlyVideo");
    var countdown = document.getElementById("countdownScreen");

    if (!video || !countdown) {
        isVideoPlaying = false;
        return;
    }

    countdown.style.display = "none";
    video.style.display = "block";

    video.pause();
    video.currentTime = 0;

    video.src = hourlyVideoFile;
    video.load();

    video.muted = true;

    try {
        var playResult = video.play();

        if (playResult && playResult.catch) {
            playResult.catch(function() {
                finishHourlyVideo();
            });
        }

    } catch (error) {
        finishHourlyVideo();
    }
}


/* ==========================================
   FINISH VIDEO AND RETURN TO COUNTDOWN
   ========================================== */

function finishHourlyVideo() {

    var video = document.getElementById("hourlyVideo");
    var countdown = document.getElementById("countdownScreen");

    if (!isVideoPlaying) {
        return;
    }

    isVideoPlaying = false;

    if (video) {
        video.pause();
        video.style.display = "none";
        video.currentTime = 0;
    }

    if (countdown) {
        countdown.style.display = "block";
    }

    updateCountdown();
    updateBackground();
}


/* ==========================================
   VIDEO EVENTS
   ========================================== */

var promoVideo = document.getElementById("hourlyVideo");

promoVideo.onended = function() {
    finishHourlyVideo();
};

promoVideo.onerror = function() {
    finishHourlyVideo();
};


/* ==========================================
   CHECK CLOCK EVERY SECOND
   ========================================== */

function checkHourlyVideo() {
    var now = new Date();
    var shouldPlay = false;

    for (var i = 0; i < playbackSchedule.length; i++) {
        if (
            playbackSchedule[i].hour == now.getHours() &&
            playbackSchedule[i].minute == now.getMinutes()
        ) {
            shouldPlay = true;
            break;
        }
    }

    if (
        shouldPlay &&
        now.getSeconds() <= 10 &&
        !isVideoPlaying
    ) {
        playHourlyVideo();
    }
}


/* ==========================================
   INITIALIZE
   ========================================== */

updateCountdown();
updateBackground();

// Check the clock every second
setInterval(checkHourlyVideo, 1000);
setInterval(updateCountdown, 1000);
setInterval(updateBackground, 60000);
setInterval(checkHourlyVideo, 1000);



</script>

</body>
</html>
