<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>YEP!! Countdown</title>
<style>
  :root {
    --deep: #062f32;
    --deep2: #0a4548;
    --mint: #bde9d9;
    --white: #fffdf8;
    --gold: #e5c783;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: Inter, Aptos, "Segoe UI", Arial, sans-serif;
    color: var(--white);
	
  background-color: #062f32;
  background-position: center center;
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  
  background-image:
    linear-gradient(
      rgba(4, 35, 38, 0.35),
      rgba(4, 35, 38, 0.55)
    ),
    var(--bg-image, url("./YEP-countdown-night.png"));
	}
  .scene { position: relative; width: 100vw; height: 100vh; min-height: 420px; overflow: hidden;}
  .sun {
    position: absolute; width: min(31vw, 42vh); aspect-ratio: 1;
    right: 11%; top: 8%; border-radius: 50%;
    background: linear-gradient(145deg, #f1dba7, #cda96b);
    opacity: .94; box-shadow: 0 0 100px rgba(229,199,131,.16);
	display: none;
  }
  .sun::after {
    content: ""; position: absolute; inset: 10%;
    border: 1px solid rgba(6,47,50,.2); border-radius: 50%;
	display: none;
  }
  .horizon {
    position: absolute; left: -5%; right: -5%; bottom: -9%;
    height: 39%; border-radius: 50% 50% 0 0 / 24% 24% 0 0;
    background: linear-gradient(180deg, rgba(31,112,101,.82), #073236 72%);
    transform: rotate(-2deg);
	display: none;
  }
  .wave {
    position: absolute; left: -8%; right: -8%; bottom: 10%;
    height: 18%; border-top: 2px solid rgba(189,233,217,.3);
    border-radius: 50%; transform: rotate(2deg);
	display: none;
  }
  .wave.w2 { bottom: 4%; left: 12%; transform: rotate(-3deg); opacity: .6; }
  .content {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    padding: 5vh 5vw 7vh; z-index: 3;
  }
  .eyebrow {
    font-size: clamp(30px, 1.1vw, 22px); letter-spacing: .28em;
    text-transform: uppercase; color: var(--mint); font-weight: 650;
  }
  .logo {
    margin-top: 1.2vh; font-weight: 900; letter-spacing: -.075em;
    line-height: .9; font-size: clamp(76px, 12vw, 190px);
    text-shadow: 0 6px 28px rgba(0,0,0,.16);
  }
  .tagline {
    margin-top: 2.3vh; font-size: clamp(60px, 1.7vw, 30px);
    letter-spacing: .18em; font-weight: 600;
  }
  .sub { margin-top: 1vh; color: rgba(255,253,248,.76); font-size: clamp(12px, 1vw, 20px); }
  .countdown {
    display: grid; grid-template-columns: repeat(4, minmax(90px, 1fr));
    gap: clamp(8px, 1.3vw, 24px); width: min(78vw, 1100px);
    margin-top: 5vh;
  }
  .unit {
    padding: clamp(12px, 1.5vw, 25px) 8px clamp(10px, 1.2vw, 20px);
    border: 1px solid rgba(255,255,255,.19); border-radius: 15px;
    background: rgba(2,31,33,.38); backdrop-filter: blur(6px);
    box-shadow: 0 12px 30px rgba(0,0,0,.08);
  }
  .number {
    font-variant-numeric: tabular-nums; font-weight: 750;
    font-size: clamp(35px, 5.2vw, 82px); line-height: 1;
    letter-spacing: -.045em;
  }
  .label {
    margin-top: 1.1vh; font-size: clamp(10px, .9vw, 16px);
    letter-spacing: .2em; color: var(--mint); font-weight: 650;
  }
  .footer {
    position: absolute; z-index: 4; bottom: 2.7vh; left: 0; right: 0;
    text-align: center; font-size: clamp(10px, .8vw, 15px);
    letter-spacing: .13em; color: rgba(255,253,248,.66);
	display: none;
  }
  .plane {
    position: absolute; z-index: 2; top: 18%; left: -10%;
    width: clamp(34px, 4vw, 65px); opacity: .85;
    animation: fly 24s linear infinite;
  }
  @keyframes fly {
    0% { transform: translateX(0) translateY(20px) rotate(-8deg); }
    50% { transform: translateX(60vw) translateY(-15px) rotate(-2deg); }
    100% { transform: translateX(125vw) translateY(4px) rotate(3deg); }
  }
  .date-note { display: none; margin-top: 2vh; font-size: clamp(12px, 1vw, 18px); color: var(--gold); }
  .finished .countdown { display: none; }
  .finished .date-note { display: block; }
  @media (max-aspect-ratio: 4/3) {
    .countdown { width: 90vw; gap: 7px; }
    .unit { border-radius: 10px; }
    .sun { right: -2%; top: 7%; width: 42vw; }
  }

/* Legacy Tizen Browser compatibility */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.scene {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 0;
}

.content {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.eyebrow {
  font-size: 24px;
  max-width: 90%;
}

.tagline {
  font-size: 42px;
  max-width: 90%;
}

.sub {
  font-size: 20px;
}

.countdown {
  display: flex;
  width: 85%;
  max-width: none;
  gap: 16px;
  margin-top: 40px;
}

.unit {
  flex: 1;
  min-width: 0;
  padding: 24px 8px;
  background: rgba(2, 31, 33, 0.75);
  backdrop-filter: none;
}

.number {
  font-size: 64px;
  line-height: 1.2;
}

.label {
  font-size: 16px;
}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="sun"></div>
  <div class="horizon"></div>
  <div class="wave"></div><div class="wave w2"></div>
  <svg class="plane" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M7 52 L42 45 L56 12 Q60 5 65 10 L62 42 L89 34 Q97 32 97 38 L96 43 L62 57 L58 83 Q57 89 52 85 L44 62 L14 69 Z" fill="#fffdf8"/>
  </svg>
  <main class="content">
    <div class="eyebrow">MBI & HSTA · YEAR END CELEBRATION 2026</div>
    <div class="tagline">ANDA LAYAK DAPAT BINTANG</div>
    <div class="sub">the countdown to Bali has officially begins</div>
    <section class="countdown" aria-label="Countdown to YEP">
      <div class="unit"><div class="number" id="days">--</div><div class="label">DAYS</div></div>
      <div class="unit"><div class="number" id="hours">--</div><div class="label">HOURS</div></div>
      <div class="unit"><div class="number" id="minutes">--</div><div class="label">MINUTES</div></div>
      <div class="unit"><div class="number" id="seconds">--</div><div class="label">SECONDS</div></div>
    </section>
    <div class="date-note" id="dateNote">IT'S TIME FOR YEP!!</div>
  </main>
  <div class="footer">REFLECT THE JOURNEY · CELEBRATE WHAT'S NEXT</div>
</div>
<script>
  /*
    IMPORTANT: Set the confirmed event date/time below before displaying this page.
    Format: YYYY-MM-DDTHH:MM:SS+08:00 for Bali local time (WITA).
    Example only: 2026-12-18T18:00:00+08:00
  */
  const EVENT_DATE = "2026-12-16T18:00:00+08:00"; // CHANGE TO CONFIRMED EVENT DATE

  const target = new Date(EVENT_DATE).getTime();
  const pad = n => String(n).padStart(2, "0");
  function updateCountdown() {
    const diff = target - Date.now();
    if (!Number.isFinite(target)) return;
    if (diff <= 0) {
      document.getElementById("scene").classList.add("finished");
      return;
    }
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);
    document.getElementById("days").textContent = String(days).padStart(2, "0");
    document.getElementById("hours").textContent = pad(hours);
    document.getElementById("minutes").textContent = pad(minutes);
    document.getElementById("seconds").textContent = pad(seconds);
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);
  
// Automatic background based on local device time
// Automatic background based on local device time
function updateBackground() {
  var hour = new Date().getHours();
  var image;

  if (hour >= 6 && hour < 15) {
    image = "YEP-countdown-daylight.png";
  } else if (hour >= 15 && hour < 18) {
    image = "YEP-countdown-sunset.png";
  } else {
    image = "YEP-countdown-night.png";
  }

  var img = new Image();

  img.onload = function () {
    document.body.style.backgroundImage =
      'linear-gradient(rgba(4,35,38,0.35), rgba(4,35,38,0.55)), url("' +
      img.src + '")';
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundPosition = "center center";
    document.body.style.backgroundRepeat = "no-repeat";
  };

  img.onerror = function () {
    document.body.style.backgroundImage = "none";
    document.body.style.backgroundColor = "#062f32";
  };

  img.src = image;
}

updateBackground();
setInterval(updateBackground, 60000);
</script>
</body>
</html>
